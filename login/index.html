<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Akun Bot - ReyCode Mail</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-wider text-cyan-400">REY<span class="text-white">CODE</span>.MAIL</a>
            <a href="/" class="text-xs text-slate-400 hover:text-white transition">&larr; Kembali ke Beranda</a>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto px-4 py-16 flex-grow flex items-center">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl w-full">
            <h3 class="text-xl font-bold text-white mb-1">🔑 Log Masuk Akun Bot</h3>
            <p class="text-xs text-slate-400 mb-6">Masukkan email yang telah dibuat dari bot WhatsApp untuk membuka inbox-nya.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Alamat Email</label>
                    <input type="text" id="loginEmailInput" placeholder="contoh: rch123@reycode.my.id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs sm:text-sm font-mono text-cyan-300 outline-none focus:border-cyan-700 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password / Kode Akses (Opsional)</label>
                    <input type="password" id="loginPassInput" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs sm:text-sm text-white outline-none focus:border-cyan-700 transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold py-3 rounded-xl transition text-xs sm:text-sm shadow-lg">
                    Buka Inbox Akun
                </button>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600">
        Powered by ReyCloudSHP &bull; Custom Cloudflare MX & Vercel Serverless
    </footer>

    <script>
        function showToast(message, type = 'success') {
            const oldToast = document.getElementById('customToast');
            if (oldToast) oldToast.remove();
            const toast = document.createElement('div');
            toast.id = 'customToast';
            toast.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs sm:text-sm font-medium transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-2 ${
                type === 'success' ? 'bg-slate-900 border-cyan-800 text-cyan-300' : 'bg-slate-900 border-red-800 text-red-400'
            }`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-[-20px]', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmailInput').value.trim().toLowerCase();
            const password = document.getElementById('loginPassInput').value.trim();

            if (!email) {
                showToast('Masukkan alamat email terlebih dahulu!', 'error');
                return;
            }

            try {
                const res = await axios.post('/api/auth/login', { email, password });
                if (res.data.success) {
                    showToast(`Berhasil login ke ${email}! Mengalihkan...`, 'success');
                    setTimeout(() => {
                        window.location.href = `/?email=${email}`;
                    }, 1500);
                }
            } catch (err) {
                showToast(err.response?.data?.error || 'Gagal memuat akun', 'error');
            }
        }
    </script>
</body>
</html>
